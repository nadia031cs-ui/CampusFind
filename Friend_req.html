<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Requests</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

body {
    background: rgb(60, 45, 131);
    display: flex;
    min-height: 100vh;
}

/* Sidebar */

aside {
    width: 250px;
    background: rgb(14, 3, 77);
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

nav a {
    text-decoration: none;
    color: white;
    background: rgb(20, 8, 91);
    padding: 12px;
    border-radius: 8px;
    font-size: 18px;
    transition: .3s;
}

nav a:hover {
    background: white;
    color: black;
}

/* Main */

main {
    flex: 1;
    padding: 35px;
}

/* Search */

.search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.search-bar input {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

.search-bar button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: white;
    color: rgb(60, 45, 131);
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.search-bar button:hover {
    background: rgb(225, 225, 225);
}

/* Card */

.card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 6px 15px rgba(0,0,0,.2);
}

.card h2 {
    color: rgb(60, 45, 131);
    margin-bottom: 10px;
}

.card p {
    color: #555;
    margin-bottom: 25px;
}

/* Table */

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: rgb(60, 45, 131);
    color: white;
    padding: 15px;
    text-align: left;
}

td {
    padding: 15px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: rgb(245,245,245);
}

/* Buttons */

.action-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    transition: .3s;
    font-size: 14px;
}

.accept-btn {
    background: #28a745;
}

.accept-btn:hover {
    background: #218838;
}

.delete-btn {
    background: #dc3545;
    margin-left: 8px;
}

.delete-btn:hover {
    background: #bb2d3b;
}

/* Empty message */

.empty-message {
    text-align: center;
    color: #777;
    padding: 40px;
    font-size: 17px;
}

/* Back */

.back {
    margin-top: 25px;
    text-align: center;
}

.back a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.back a:hover {
    text-decoration: underline;
}

/* Responsive */

@media(max-width:600px){

    body{
        flex-direction: column;
    }

    aside{
        width:100%;
    }

    main{
        padding:20px;
    }

    table{
        display:block;
        overflow-x:auto;
    }

    .search-bar{
        flex-direction:column;
    }

    .search-bar button{
        width:100%;
    }

    .action-btn{
        width:100%;
        margin:5px 0;
    }

    .delete-btn{
        margin-left:0;
    }
}
    </style>

    <link rel="stylesheet" href="Friend_req.css">
</head>

<body>

    <aside>

        <div class="logo">
            <img src="cmpLOGO.jpeg" alt="" width="180">
        </div>

        <nav>
            <a href="friends.html">Friends</a>
            <a href="FindFriends.html">Find Friends</a>
            <a href="Friend_req.html">Friend Requests</a>
        </nav>

    </aside>

    <main>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search friend requests...">
            <button id="searchBtn">Go</button>
        </div>

        <div class="card">

            <h2>Friend Requests</h2>

            <p>Accept or remove incoming friend requests.</p>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Campus ID</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="requestTable">

                   

                </tbody>

            </table>

        </div>

        <div class="back">
            <p>Back to <a href="Home_Feed.html">Home</a></p>
        </div>

    </main>

   
    <script src="Friend_req.js"></script>

</body>

</html>
