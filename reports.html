<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <!-- Apply saved/preferred theme BEFORE first paint, to avoid a flash of the wrong theme -->
    <script>
        (function () {
            var t = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link rel="stylesheet" href="theme.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: var(--color-app-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 10px;
            background: var(--color-sidebar-item-bg);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px var(--shadow-color);
            transition: .3s;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
        }

        form {
            width: 700px;
            max-width: 100%;
            background: var(--color-card-bg);
            color: var(--color-card-text);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px var(--shadow-color);
        }

        h2 {
            color: var(--color-accent-text);
            margin-bottom: 10px;
        }

        p {
            color: var(--color-text-muted);
            margin-bottom: 25px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-items: center;
            margin-bottom: 18px;
        }

        .comment-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: var(--color-accent-text);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-placeholder-border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: var(--color-card-bg);
            color: var(--color-card-text);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: var(--color-accent-text);
            box-shadow: 0 0 5px var(--shadow-color);
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            background: var(--color-app-bg);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button[type="submit"]:hover {
            background: var(--color-sidebar-item-bg);
        }

        @media(max-width:768px) {

            form {
                padding: 25px;
            }

            .form-group {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>

    <form action="Submit.php">

        <h2>Feedback</h2>
        <p>We'd love to hear your thoughts and suggestions.</p>

        <div class="form-group">
            <label for="Name">Name</label>
            <input type="text" id="Name" placeholder="Enter Your Name" required>

            <label for="Email">Email</label>
            <input type="email" id="Email" placeholder="Enter Your Email" required>
        </div>

        <div class="comment-group">
            <label for="Comments">Comments</label>
            <textarea id="Comments" placeholder="Enter Your Comments"></textarea>
        </div>

        <button type="submit">Submit</button>

    </form>

    <script src="theme.js"></script>

</body>

</html>
