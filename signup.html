<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            text-align: center;
        }

        body>div:first-of-type p {
            color: white;
            margin-bottom: 25px;
            text-align: center;
        }

        form {
            width: 700px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
        }

        form div {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 18px;
            align-items: center;
        }

        label {
            font-weight: bold;
            color: rgb(60, 45, 131);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: rgb(60, 45, 131);
            box-shadow: 0 0 5px rgba(60, 45, 131, .25);
        }

        button {
            width: 700px;
            max-width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: rgb(60, 45, 131);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: rgb(20, 8, 91);
        }

        body>div:last-of-type {
            margin-top: 20px;
        }

        body>div:last-of-type p {
            color: white;
        }

        a {
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media(max-width:768px) {

            form {
                padding: 25px;
            }

            form div {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>Create Your Account</h1>
    <div>
        <p>Fill in the details below to get started</p>
    </div>
    <form action="Register.php">
        <div>
            <label for="Full Name">Full Name</label>

            <input type="text" placeholder="Enter your full name" required>
            <label for="Age">Age</label>
            <input type="text" placeholder="Age" required>

        </div>
        <div>
            <label for="Gender">Gender</label>
            <select id="Gender">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Others">Others</option>

            </select>

            <label for="Phone Number">Phone Number</label>
            <input type="tel" placeholder="Enter Your Number" required>
        </div>
        <div>
            <label for="Date of Birth">Date of Birth</label>
            <input type="date" placeholder="DOB" required>

            <label for="Email Address">Email</label>
            <input type="text" placeholder="Enter Your Email Address">
        </div>
        <div>
            <label for="Password">Password</label>
            <input type="password" id="Password" placeholder="Create a strong password" required>
        </div>

        <button type="submit">Create Account</button>


    </form>
    <div>
        <p>Already have an account? <a href="/Login.html">Login</a></p>

    </div>



    <script>
        document.addEventListener("DOMContentLoaded", function () {

            console.log("CampusFind Registration Loaded.");

            const form = document.querySelector("form");

            const fullName = document.querySelector('input[placeholder="Enter your full name"]');
            const age = document.querySelector('input[placeholder="Age"]');
            const gender = document.getElementById("Gender");
            const phone = document.querySelector('input[type="tel"]');
            const dob = document.querySelector('input[type="date"]');
            const email = document.querySelector('input[placeholder="Enter Your Email Address"]');
            const password = document.getElementById("Password");

            const loginLink = document.querySelector("a");

            // Focus Effect
            const fields = document.querySelectorAll("input, select");

            fields.forEach(function (field) {

                field.addEventListener("focus", function () {
                    field.style.boxShadow = "0 0 8px rgba(60,45,131,.5)";
                });

                field.addEventListener("blur", function () {
                    field.style.boxShadow = "none";
                });

            });

            // Login Link
            loginLink.addEventListener("click", function () {
                console.log("Opening Login Page...");
            });

            // Form Validation
            form.addEventListener("submit", function (event) {

                event.preventDefault();

                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const phonePattern = /^[0-9]{11}$/;

                if (fullName.value.trim() === "") {
                    alert("Please enter your full name.");
                    fullName.focus();
                    return;
                }

                if (age.value.trim() === "" || isNaN(age.value) || age.value < 16) {
                    alert("Please enter a valid age.");
                    age.focus();
                    return;
                }

                if (phone.value.trim() === "") {
                    alert("Please enter your phone number.");
                    phone.focus();
                    return;
                }

                if (!phonePattern.test(phone.value)) {
                    alert("Phone number must contain exactly 11 digits.");
                    phone.focus();
                    return;
                }

                if (dob.value === "") {
                    alert("Please select your date of birth.");
                    dob.focus();
                    return;
                }

                if (email.value.trim() === "") {
                    alert("Please enter your email.");
                    email.focus();
                    return;
                }

                if (!emailPattern.test(email.value)) {
                    alert("Please enter a valid email address.");
                    email.focus();
                    return;
                }

                if (password.value.length < 6) {
                    alert("Password must contain at least 6 characters.");
                    password.focus();
                    return;
                }
                // Save Signup Data
                const profile = {
                    name: fullName.value,
                    age: age.value,
                    gender: gender.value,
                    phone: phone.value,
                    dob: dob.value,
                    email: email.value,

                    // Default Values
                    id: "221-15-XXXX",
                    department: "CSE",
                    semester: "Semester 7",
                    batch: "61",
                    photo: "default-profile.png"
                };

                // Save into Local Storage
                localStorage.setItem("profile", JSON.stringify(profile));

                alert("Registration Successful!");

                console.log({
                    Name: fullName.value,
                    Age: age.value,
                    Gender: gender.value,
                    Phone: phone.value,
                    DOB: dob.value,
                    Email: email.value
                });

                // Redirect to login page
                window.location.href = "Login.html";

            });

            // Press Enter to Submit

</body>

</html>
