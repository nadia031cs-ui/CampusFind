<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Media</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            padding: 35px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgb(225, 225, 225);
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
            margin-bottom: 25px;
        }

        h2 {
            color: rgb(60, 45, 131);
            margin-bottom: 15px;
        }

        ol {
            padding-left: 25px;
        }

        ol li {
            margin-bottom: 12px;
            font-size: 17px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgb(60, 45, 131);
            color: white;
            padding: 14px;
        }

        td {
            text-align: center;
            padding: 14px;
            border: 1px solid #ddd;
        }

        label {
            display: block;
            font-weight: bold;
            color: rgb(60, 45, 131);
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: rgb(60, 45, 131);
            box-shadow: 0 0 5px rgba(60, 45, 131, .25);
        }

        button {
            margin-top: 18px;
            padding: 12px 25px;
            background: rgb(60, 45, 131);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: .3s;
        }

        button:hover {
            background: rgb(20, 8, 91);
        }

        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        video,
        audio,
        iframe {
            width: 100%;
            border-radius: 10px;
        }

        video {
            background: black;
        }

        iframe {
            height: 315px;
            border: none;
        }

        .audio-box {
            background: rgb(245, 245, 245);
            padding: 20px;
            border-radius: 10px;
        }

        @media(max-width:900px) {
            .media-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Course Resources</h1>
        <p class="subtitle">View your courses, media resources and leave your comments.</p>

        <div class="card">

            <h2>Course List</h2>

            <ol>
                <li>TOC</li>
                <li>WP</li>
                <li>ML</li>
                <li>SE & DP</li>
            </ol>

        </div>

        <div class="card">

            <h2>Credit Hours</h2>

            <table>

                <thead>
                    <tr>
                        <th>TOC</th>
                        <th>WP</th>
                        <th>ML</th>
                        <th>SE & DP</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>4</td>
                        <td>4</td>
                        <td>4</td>
                        <td>4</td>
                    </tr>
                </tbody>

            </table>

        </div>

        <div class="card">

            <h2>Comments</h2>

            <form action="search.php">

                <label for="Comments">Comments</label>

                <textarea id="Comments" placeholder="Enter Your Comments" rows="8"></textarea>

                <button type="submit">Submit</button>

            </form>

        </div>

        <div class="card">

            <h2>Media Gallery</h2>

            <div class="media-grid">

                <div>
                    <video controls autoplay>
                        <source src="vv.mp4">
                    </video>
                </div>

                <div class="audio-box">
                    <audio controls autoplay muted>
                        <source src="a.mpeg">
                    </audio>
                </div>

                <div>
                    <iframe src="https://www.youtube.com/embed/0enmMyV1Q48?si=tOvmWl5BFXiatqkc"
                        title="YouTube video player"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </div>

                <div>
                    <video controls autoplay>
                        <source src="v1.mp4">
                    </video>

                    <br><br>

                    <audio controls autoplay muted>
                        <source src="a1.mpeg">
                    </audio>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
