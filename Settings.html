<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

body{
    background:rgb(60,45,131);
    display:flex;
    min-height:100vh;
}

img{
    position:fixed;
    top:20px;
    left:20px;
    width:180px;
    z-index:1000;
}

aside{
    width:250px;
    min-height:100vh;
    background:rgb(14,3,77);
    padding:140px 20px 20px;
    position:fixed;
    left:0;
    top:0;
}

aside nav{
    display:flex;
    flex-direction:column;
    gap:12px;
}

aside nav a{
    text-decoration:none;
    color:white;
    background:rgb(20,8,91);
    padding:12px 15px;
    border-radius:8px;
    font-size:18px;
    transition:.3s;
}

aside nav a:hover{
    background:white;
    color:black;
}

main{
    margin-left:270px;
    width:100%;
    padding:30px;
}

main input[type="text"]:first-child{
    width:100%;
    padding:12px 15px;
    border:none;
    border-radius:10px;
    margin-bottom:25px;
    font-size:16px;
    outline:none;
}

form{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,.2);
    margin-bottom:25px;
}

h2{
    color:rgb(60,45,131);
    margin-bottom:10px;
}

p{
    color:#555;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-weight:bold;
    color:rgb(60,45,131);
}

form input,
form select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

button{
    background:rgb(60,45,131);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    background:rgb(20,8,91);
}

@media(max-width:600px){

    body{
        flex-direction:column;
    }

    img{
        position:static;
        display:block;
        margin:20px auto;
    }

    aside{
        position:static;
        width:100%;
        min-height:auto;
        padding:20px;
    }

    main{
        margin-left:0;
        padding:20px;
    }
}
</style>
   
</head>

<body>
    <img src="cmpLOGO.jpeg" alt="" width="180">
    <aside>
        <nav>
        <a href="Home_Feed.html">Home Feed</a>
        <br>
        <a href="Create_Post.html">Post an Item</a>
        <br>
        <a href="University_Map.html">University Map</a>
        <br>
        <a href="Messages.html">Messages</a>
        <br>
        <a href="profiledashboard.html">Profile</a>
        <br>
        <a href="Settings.html">Settings</a>

        </nav>
    </aside>
    <main>
         <form action="">
        <input type="text" placeholder="Search anything...">
       <br>
       <h2>Settings</h2>
  <p> Manage your account preferences and application settings.</p>
     <label for="Full Name">Full Name</label>
     <input type="text" placeholder="Enter Your Name">
     <br>
     <label for="Campus ID">Campus ID</label>
     <input type="text" placeholder="Campus ID">
     <br>
     <label for="Email">Email Address</label>
     <input type="email" placeholder="Enter Your Email">
     <br>
     <label for="Department">Department</label>
     <select  id="Department">
        <option value="CSE">CSE</option>
            <option value="BBA">BBA</option>
            <option value="ENG">ENG</option>
            <option value="LAW">LAW</option>
            <option value="SWE">SWE</option>
            <option value="DS">DS</option>
     </select>
     <br>
    <label for="Year">Year</label>
    <select id="Year">
        <option value="First Year"> First Year</option>
        <option value="Second Year"> Second Year</option>
        <option value="Third Year"> Third Year</option>
        <option value="Fourth Year"> Fourth Year</option>
        </select>
        <br>

     <label for="Current Semester">Current Semester</label>
        <select id="Current Semester">
            <option value="Semester 1">Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4">Semester 4</option>
            <option value="Semester 5">Semester 5</option>
            <option value="Semester 6">Semester 6</option>
            <option value="Semester 7">Semester 7</option>
            <option value="Semester 8">Semester 8</option>
            <option value="Semester 9">Semester 9</option>
            <option value="Semester 10">Semester 10</option>
            <option value="Semester 11">Semester 11</option>
            <option value="Semester 12">Semester 12</option>

        </select>
        <br>
        <button>Save Changes</button>

    </form>
    <form action="">
        <h2>Change Password</h2>
        <p>Update your password to keep your account secure.</p>
        <label for="Current password">Current Password </label>
        <input type="text" placeholder="Enter Current password">
        <br>
        <label for="New password">New password</label>
        <input type="text" placeholder=" Enter New password">
        <br>
        <label for="Confirm New Password">Confirm New Password</label>
        <input type="text" placeholder="Confirm New Password">
        <br>
        <button>Update Password</button>
    </form>
    </main>
</body>
</html>
