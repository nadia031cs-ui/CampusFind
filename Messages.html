<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            display: flex;
            min-height: 100vh;
        }

        aside {
            width: 250px;
            background: rgb(14, 3, 77);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {
            text-decoration: none;
            color: white;
            background: rgb(20, 8, 91);
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            transition: .3s;
        }

        nav a:hover {
            background: white;
            color: black;
        }

        .logout button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgb(220, 53, 69);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .logout button:hover {
            background: rgb(180, 25, 40);
        }

        main {
            flex: 1;
            padding: 35px;
        }

        h2 {
            color: white;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgb(225, 225, 225);
            margin-bottom: 25px;
        }

        .chat-container {
            display: flex;
            gap: 20px;
            height: 75vh;
        }

        #left-panel,
        #right-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
        }

        #left-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
        }

        #left-panel h3 {
            color: rgb(60, 45, 131);
            margin-bottom: 15px;
        }

        #left-panel input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        #left-panel h4 {
            color: rgb(60, 45, 131);
            margin-bottom: 15px;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            padding: 12px;
            background: rgb(235, 235, 235);
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
        }

        .chat-item:hover {
            background: rgb(60, 45, 131);
            color: white;
        }

        #right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .chat-header {
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            color: rgb(60, 45, 131);
            font-weight: bold;
            font-size: 20px;
        }

        .messages {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .message {
            max-width: 70%;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .received {
            background: rgb(235, 235, 235);
            color: black;
        }

        .sent {
            background: rgb(60, 45, 131);
            color: white;
            margin-left: auto;
        }

        .message-box {
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .message-box input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        .message-box input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .message-box button {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: rgb(60, 45, 131);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .message img {
            max-width: 220px;
            max-height: 220px;
            border-radius: 10px;
            object-fit: cover;
            display: block;
        }

        .message-box button:hover {
            background: rgb(20, 8, 91);
        }

        @media(max-width:500px) {

            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
            }

            .chat-container {
                flex-direction: column;
                height: auto;
            }

            #left-panel {
                width: 100%;
            }

            .message-box {
                flex-direction: column;
            }

            .message-box input,
            .message-box button {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <aside>

        <div>

            <div class="logo">
                <img src="cmpLOGO.jpeg" width="180">
            </div>

            <nav>
                <a href="Home_Feed.html">Home Feed</a>
                <a href="Create_Post.html">Post an Item</a>
                <a href="University_Map.html">University Map</a>
                <a href="Messages.html">Messages</a>
                <a href="profiledashboard.html">Profile</a>
                <a href="Settings.html">Settings</a>
            </nav>

        </div>

        <div class="logout">
            <button>Logout</button>
        </div>

    </aside>

    <main>

        <h2>Chat System</h2>

        <p class="subtitle">
            Communicate and resolve found or lost items easily.
        </p>

        <div class="chat-container">

            <div id="left-panel">

                <h3>Chats</h3>

                <input type="text" placeholder="Search Conversation">

                <h4>Active Conversations</h4>

                <div class="chat-list">
                    <div class="chat-item">John Doe</div>
                    <div class="chat-item">Sarah Ahmed</div>
                    <div class="chat-item">Campus Admin</div>
                </div>

            </div>

            <div id="right-panel">

                <div>

                    <div class="chat-header">
                        John Doe
                    </div>

                    <div class="messages">

                        <div class="message received">
                            Hello! I think I found your ID card.
                        </div>

                        <div class="message sent">
                            Really? Thank you! Where can I collect it?
                        </div>

                    </div>

                </div>

                <div class="message-box">
                    <input type="text" placeholder="Write a message...">
                    <input type="file" accept="image/*">
                    <button>Send</button>
                </div>

            </div>

        </div>

    </main>

    <script>
        const chatItems = document.querySelectorAll(".chat-item");
        const chatHeader = document.querySelector(".chat-header");
        const messages = document.querySelector(".messages");
        const messageInput = document.querySelector('.message-box input[type="text"]');
        const fileInput = document.querySelector('.message-box input[type="file"]');
        const sendButton = document.querySelector(".message-box button");
        const searchInput = document.querySelector("#left-panel input");

        const chatData = {
            "John Doe": [
                {
                    type: "received",
                    text: "Hello! I think I found your ID card."
                },
                {
                    type: "sent",
                    text: "Really? Thank you! Where can I collect it?"
                }
            ],

            "Sarah Ahmed": [
                {
                    type: "received",
                    text: "Did you lose a blue notebook?"
                }
            ],

            "Campus Admin": [
                {
                    type: "received",
                    text: "Your lost item request has been received."
                }
            ]
        };

        function loadChat(name) {

            chatHeader.textContent = name;
            messages.innerHTML = "";

            chatData[name].forEach(msg => {

                const div = document.createElement("div");
                div.className = "message " + msg.type;

                if (msg.image) {

                    const img = document.createElement("img");
                    img.src = msg.image;
                    img.style.maxWidth = "220px";
                    img.style.borderRadius = "10px";
                    img.style.display = "block";
                    img.style.cursor = "pointer";

                    div.appendChild(img);

                } else {

                    div.textContent = msg.text;

                }

                messages.appendChild(div);

            });

            messages.scrollTop = messages.scrollHeight;
        }

        chatItems.forEach(item => {

            item.addEventListener("click", () => {
                loadChat(item.textContent.trim());
            });

        });

        function sendMessage() {

            const text = messageInput.value.trim();
            const file = fileInput.files[0];

            if (text === "" && !file) {
                alert("Please write a message or select an image.");
                return;
            }

            const currentChat = chatHeader.textContent;

            if (text !== "") {

                const msg = {
                    type: "sent",
                    text: text
                };

                chatData[currentChat].push(msg);

                const div = document.createElement("div");
                div.className = "message sent";
                div.textContent = text;

                messages.appendChild(div);

            }

            if (file) {

                const reader = new FileReader();

                reader.onload = function (e) {

                    const imageURL = e.target.result;

                    chatData[currentChat].push({
                        type: "sent",
                        image: imageURL
                    });

                    const div = document.createElement("div");
                    div.className = "message sent";

                    const img = document.createElement("img");
                    img.src = imageURL;
                    img.style.maxWidth = "220px";
                    img.style.borderRadius = "10px";
                    img.style.display = "block";
                    img.style.cursor = "pointer";

                    div.appendChild(img);

                    messages.appendChild(div);

                    messages.scrollTop = messages.scrollHeight;

                };

                reader.readAsDataURL(file);

            }

            messageInput.value = "";
            fileInput.value = "";

            messages.scrollTop = messages.scrollHeight;
        }

        sendButton.addEventListener("click", sendMessage);

        messageInput.addEventListener("keydown", function (e) {

            if (e.key === "Enter") {
                e.preventDefault();
                sendMessage();
            }

        });

        searchInput.addEventListener("keyup", function () {

            const value = this.value.toLowerCase();

            chatItems.forEach(item => {

                if (item.textContent.toLowerCase().includes(value)) {
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }

            });

        });

        loadChat("John Doe");
    </script>

</body>

</html>
