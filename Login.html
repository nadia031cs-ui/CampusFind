<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            background-image: url("./Floors/uni.jpeg");
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
         

        .container {
            width: 450px;
            max-width: 100%;
            text-align: center;
        }

        .logo img {
            width: 180px;
            margin-bottom: 20px;
        }

        h2 {
            color:rgb(60, 45, 131);
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            color: rgb(60, 45, 131);
            margin-bottom: 30px;
        }

        form {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgb(60, 45, 131);
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            margin-bottom: 18px;
            font-size: 15px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options a {
            color: rgb(60, 45, 131);
            text-decoration: none;
            font-weight: bold;
        }

        .options a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: rgb(60, 45, 131);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: rgb(20, 8, 91);
        }

        .signup {
            margin-top: 25px;
            color: rgb(60, 45, 131);
        }

        .signup a {
            color: rgb(60, 45, 131);
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        @media(max-width:600px) {

            .container {
                width: 100%;
            }

            form {
                padding: 25px;
            }

            .options {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="MU.jpeg" alt="CampusFind Logo">
        </div>

        <h2>CampusFind Login</h2>

        <p class="subtitle">
            Sign in to access your CampusFind account.
        </p>

        <form action="Signin.php" method="post">

            <label for="email">Email</label>

            <input type="text" id="email" name="email" placeholder="Enter Your Email" required>

            <label for="password">Password</label>

            <input type="password" id="password" name="password" placeholder="Enter Your Password" required>

            <div class="options">

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <a href="Forget_Password.html">Forgot Password?</a>

            </div>

            <button type="submit">Login</button>

        </form>

        <div class="signup">

            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script src="Signin.js"></script>

</body>

</html>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.querySelector("form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const remember = document.getElementById("remember");
    const forgotLink = document.querySelector(".options a");
    const signupLink = document.querySelector(".signup a");

    email.addEventListener("focus", function () {
        email.style.boxShadow = "0 0 8px rgba(60,45,131,.5)";
    });

    email.addEventListener("blur", function () {
        email.style.boxShadow = "none";
    });

    password.addEventListener("focus", function () {
        password.style.boxShadow = "0 0 8px rgba(60,45,131,.5)";
    });

    password.addEventListener("blur", function () {
        password.style.boxShadow = "none";
    });

    remember.addEventListener("change", function () {
        console.log(remember.checked ? "Remember Me Enabled" : "Remember Me Disabled");
    });

    forgotLink.addEventListener("click", function () {
        console.log("Forgot Password clicked.");
    });

    signupLink.addEventListener("click", function () {
        console.log("Opening Sign Up page.");
    });

    form.addEventListener("submit", function (event) {

        event.preventDefault();

        const emailValue = email.value.trim();
        const passwordValue = password.value.trim();

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (emailValue === "") {
            alert("Please enter your email.");
            email.focus();
            return;
        }

        if (!emailPattern.test(emailValue)) {
            alert("Please enter a valid email address.");
            email.focus();
            return;
        }

        if (passwordValue === "") {
            alert("Please enter your password.");
            password.focus();
            return;
        }

        if (passwordValue.length < 6) {
            alert("Password must contain at least 6 characters.");
            password.focus();
            return;
        }

        const savedUser = JSON.parse(localStorage.getItem("user"));

        if (!savedUser) {
            alert("No account found. Please Sign Up first.");
            window.location.href = "signup.html";
            return;
        }

        if (emailValue !== savedUser.email) {
            alert("Incorrect Email.");
            email.focus();
            return;
        }

        if (passwordValue !== savedUser.password) {
            alert("Incorrect Password.");
            password.focus();
            return;
        }

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("username", savedUser.name);

        if (savedUser.photo) {
            localStorage.setItem("profileImage", savedUser.photo);
        }

        alert("Login Successful!");
        window.location.href = "Home_Feed.html";

    });

    email.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();
            password.focus();
        }
    });

    password.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();
            form.requestSubmit();
        }
    });

});
</script>

</body>

</html>
