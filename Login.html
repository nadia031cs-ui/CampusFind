<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 450px;
            max-width: 100%;
            text-align: center;
        }

        .logo img {
            width: 180px;
            margin-bottom: 20px;
        }

        h2 {
            color: white;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #ddd;
            margin-bottom: 30px;
        }

        form {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgb(60, 45, 131);
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            margin-bottom: 18px;
            font-size: 15px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options a {
            color: rgb(60, 45, 131);
            text-decoration: none;
            font-weight: bold;
        }

        .options a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: rgb(60, 45, 131);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: rgb(20, 8, 91);
        }

        .signup {
            margin-top: 25px;
            color: white;
        }

        .signup a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        @media(max-width:600px) {

            .container {
                width: 100%;
            }

            form {
                padding: 25px;
            }

            .options {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="MU.jpeg" alt="CampusFind Logo">
        </div>

        <h2>CampusFind Login</h2>

        <p class="subtitle">
            Sign in to access your CampusFind account.
        </p>

        <form action="Signin.php" method="post">

            <label for="email">Email</label>

            <input type="text" id="email" name="email" placeholder="Enter Your Email" required>

            <label for="password">Password</label>

            <input type="password" id="password" name="password" placeholder="Enter Your Password" required>

            <div class="options">

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <a href="Forget_Password.html">Forgot Password?</a>

            </div>

            <button type="submit">Sign In</button>

        </form>

        <div class="signup">

            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script src="Signin.js"></script>

</body>

</html>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        console.log("CampusFind Sign In Loaded.");

        const form = document.querySelector("form");
        const email = document.querySelector('input[type="text"]');
        const password = document.querySelector('input[type="password"]');
        const remember = document.getElementById("remember");
        const forgotLink = document.querySelector('.options a');
        const signupLink = document.querySelector('.signup a');

        // Focus Effects
        email.addEventListener("focus", function () {
            email.style.boxShadow = "0 0 8px rgba(60,45,131,.5)";
        });

        email.addEventListener("blur", function () {
            email.style.boxShadow = "none";
        });

        password.addEventListener("focus", function () {
            password.style.boxShadow = "0 0 8px rgba(60,45,131,.5)";
        });

        password.addEventListener("blur", function () {
            password.style.boxShadow = "none";
        });

        // Remember Me
        remember.addEventListener("change", function () {

            if (remember.checked) {
                console.log("Remember Me Enabled");
            } else {
                console.log("Remember Me Disabled");
            }

        });

        // Forgot Password
        forgotLink.addEventListener("click", function () {
            console.log("Forgot Password clicked.");
        });

        // Sign Up
        signupLink.addEventListener("click", function () {
            console.log("Opening Sign Up page.");
        });

        // Form Validation
        form.addEventListener("submit", function (event) {

            const emailValue = email.value.trim();
            const passwordValue = password.value.trim();

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailValue === "") {
                event.preventDefault();
                alert("Please enter your email.");
                email.focus();
                return;
            }

            if (!emailPattern.test(emailValue)) {
                event.preventDefault();
                alert("Please enter a valid email address.");
                email.focus();
                return;
            }

            if (passwordValue === "") {
                event.preventDefault();
                alert("Please enter your password.");
                password.focus();
                return;
            }

            if (passwordValue.length < 6) {
                event.preventDefault();
                alert("Password must contain at least 6 characters.");
                password.focus();
                return;
            }

            alert("Login Successful!");

            console.log("Email:", emailValue);

            // Remove the next two lines if Signin.php handles the login.
            event.preventDefault();
            window.location.href = "Home_Feed.html";

        });

        // Press Enter inside Email
        email.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                event.preventDefault();
                password.focus();
            }

        });

        // Press Enter inside Password
        password.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                event.preventDefault();
                form.requestSubmit();
            }

        });

    });
</script>

</body>

</html>
