<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
      
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

body {
    background: rgb(60, 45, 131);
    display: flex;
    min-height: 100vh;
}

aside {
    width: 250px;
    background: rgb(14, 3, 77);
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    color: white;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 30px;
}

nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

nav a {
    text-decoration: none;
    color: white;
    background: rgb(20, 8, 91);
    padding: 12px;
    border-radius: 8px;
    transition: .3s;
    font-size: 18px;
}

nav a:hover {
    background: white;
    color: black;
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;

    background-image:
        linear-gradient(rgba(60, 45, 131, 0.55), rgba(60, 45, 131, 0.55)),
        url("ForgetPass.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.container {
    width: 500px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .3);
}

h1 {
    color: rgb(14, 3, 77);
    margin-bottom: 12px;
}

p {
    color: rgb(70, 70, 70);
    margin-bottom: 25px;
    line-height: 1.6;
}

label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    color: rgb(14, 3, 77);
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
    margin-bottom: 20px;
    transition: .3s;
}

input:focus {
    border-color: rgb(60, 45, 131);
    box-shadow: 0 0 8px rgba(60, 45, 131, .4);
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: rgb(20, 8, 91);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: rgb(60, 45, 131);
}

.back {
    margin-top: 20px;
}

.back a {
    color: rgb(20, 8, 91);
    text-decoration: none;
    font-weight: bold;
}

.back a:hover {
    text-decoration: underline;
}

@media (max-width: 600px) {
    body {
        flex-direction: column;
    }

    aside {
        width: 100%;
    }

    main {
        padding: 20px;
        background-position: center;
    }

    .container {
        width: 100%;
        max-width: 450px;
    }
}
</style> 
    

</head>

<body>

    <aside>

        <div class="logo">
            CampusFind
        </div>

        <nav>
            <a href="Home_Feed.html">Home Feed</a>
            <a href="profiledashboard.html">Profile</a>
            <a href="Settings.html">Settings</a>
        </nav>

    </aside>

    <main>

        <div class="container">

            <h1>Reset Your Password</h1>

            <p>
                Enter the email address associated with your account and we'll send you a password reset link.
            </p>

            <form action="abcd">

                <label for="email">Email Address</label>

                <input type="email" id="email" placeholder="Enter Your Email" required>

                <button type="submit">Send Reset Link</button>

            </form>

            <div class="back">
                <p>Back to <a href="Login.html">Login</a></p>
            </div>

        </div>

    </main>

</body>

</html>
