<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            display: flex;
            min-height: 100vh;
        }

        aside {
            width: 250px;
            background: rgb(14, 3, 77);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-link {
            display: block;
            text-decoration: none;
            color: white;
            background: rgb(20, 8, 91);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 18px;
            transition: .3s;
        }

        .profile-link:hover {
            background: white;
            color: black;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {
            text-decoration: none;
            color: white;
            background: rgb(20, 8, 91);
            padding: 12px;
            border-radius: 8px;
            transition: .3s;
            font-size: 18px;
        }

        nav a:hover {
            background: white;
            color: black;
        }

        .logout button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgb(220, 53, 69);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .logout button:hover {
            background: rgb(180, 25, 40);
        }

        main {
            flex: 1;
            padding: 35px;
        }

        .search {
            margin-bottom: 25px;
        }

        .search input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
        }

        h2 {
            color: rgb(60, 45, 131);
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: rgb(60, 45, 131);
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: rgb(60, 45, 131);
            box-shadow: 0 0 5px rgba(60, 45, 131, .25);
        }

        .full {
            grid-column: 1 / 3;
        }

        .buttons {
            grid-column: 1 / 3;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 10px;
        }

        .cancel {
            background: rgb(220, 53, 69);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .save {
            background: rgb(60, 45, 131);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .cancel:hover {
            background: rgb(180, 25, 40);
        }

        .save:hover {
            background: rgb(20, 8, 91);
        }

        @media(max-width:600px) {

            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
            }

            main {
                padding: 20px;
            }

            form {
                grid-template-columns: 1fr;
            }

            .full,
            .buttons {
                grid-column: auto;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons button {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <aside>

        <div>

            <div class="logo">
                <img src="cmpLOGO.jpeg" alt="" width="180">
            </div>

            <a href="profiledashboard.html" class="profile-link">Your Profile</a>

            <nav>
                <a href="Home_Feed.html">Home Feed</a>
                <a href="Post_an_Item.html">Post an Item</a>
                <a href="University_Map.html">University Map</a>
                <a href="Messages.html">Messages</a>
                <a href="Profile.html">Profile</a>
                <a href="Settings.html">Settings</a>
            </nav>

        </div>

        <div class="logout">
            <button>Logout</button>
        </div>

    </aside>

    <main>

        <div class="search">
            <input type="text" placeholder="Search anything...">
        </div>

        <div class="card">

            <h2>Edit Profile</h2>
            <p>Update your personal and academic information below.</p>

            <form action="">

                <div class="full">
                    <label>Name</label>
                    <input type="text" placeholder="Enter Your Name">
                </div>

                <div>
                    <label>Campus ID</label>
                    <input type="text" placeholder="Enter Your ID">
                </div>

                <div>
                    <label>Current Semester</label>
                    <select>
                        <option>Semester 1</option>
                        <option>Semester 2</option>
                        <option>Semester 3</option>
                        <option>Semester 4</option>
                        <option>Semester 5</option>
                        <option>Semester 6</option>
                        <option>Semester 7</option>
                        <option>Semester 8</option>
                        <option>Semester 9</option>
                        <option>Semester 10</option>
                        <option>Semester 11</option>
                        <option>Semester 12</option>
                    </select>
                </div>

                <div>
                    <label>Department</label>
                    <select>
                        <option>CSE</option>
                        <option>BBA</option>
                        <option>ENG</option>
                        <option>LAW</option>
                        <option>SWE</option>
                        <option>DS</option>
                    </select>
                </div>

                <div>
                    <label>University Email</label>
                    <input type="email" placeholder="Enter Your Email">
                </div>

                <div>
                    <label>Batch</label>
                    <input type="text" placeholder="Enter Your Batch">
                </div>

                <div>
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Enter Your Number">
                </div>

                <div class="buttons">
                    <button type="reset" class="cancel">Cancel</button>
                    <button type="submit" class="save">Save Changes</button>
                </div>

            </form>

        </div>

    </main>

</body>

</html>
