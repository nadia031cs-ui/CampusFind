<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            display: flex;
            min-height: 100vh;
        }

        aside {
            width: 250px;
            background: rgb(14, 3, 77);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-link {
            text-decoration: none;
            color: white;
            background: rgb(20, 8, 91);
            padding: 12px;
            border-radius: 8px;
            display: block;
            text-align: center;
            margin-bottom: 25px;
            font-size: 18px;
            transition: .3s;
        }

        .profile-link:hover {
            background: white;
            color: black;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {
            text-decoration: none;
            color: white;
            background: rgb(20, 8, 91);
            padding: 12px;
            border-radius: 8px;
            transition: .3s;
            font-size: 18px;
        }

        nav a:hover {
            background: white;
            color: black;
        }

        .logout {
            margin-top: 30px;
        }

        .logout button {
            width: 100%;
            padding: 12px;
            background: rgb(220, 53, 69);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .logout button:hover {
            background: rgb(180, 25, 40);
        }

        main {
            flex: 1;
            padding: 35px;
        }

        .search {
            margin-bottom: 25px;
        }

        .search input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
        }

        h2 {
            color: rgb(60, 45, 131);
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .edit-btn {
            display: inline-block;
            text-decoration: none;
            background: rgb(60, 45, 131);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            transition: .3s;
            font-weight: bold;
        }

        .edit-btn:hover {
            background: rgb(20, 8, 91);
        }

        h4 {
            color: rgb(60, 45, 131);
            margin-bottom: 12px;
        }

        select {
            width: 250px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        @media(max-width:600px) {

            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
            }

            main {
                padding: 20px;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <aside>

        <div>

            <div class="logo">
                <img src="cmpLOGO.jpeg" alt="" width="180">
            </div>

            <a class="profile-link" href="profiledashboard.html">Your Profile</a>

            <nav>
                <a href="Home_Feed.html">Home Feed</a>
                <a href="Post_an_Item.html">Post an Item</a>
                <a href="University_Map.html">University Map</a>
                <a href="Messages.html">Messages</a>
                <a href="profiledashboard.html">Profile</a>
                <a href="Settings.html">Settings</a>
            </nav>

        </div>

        <div class="logout">
            <button>Logout</button>
        </div>

    </aside>

    <main>

        <div class="search">
            <input type="text" placeholder="Search anything...">
        </div>

        <div class="card">

            <h2>Profile Dashboard</h2>
            <p>View and manage your profile and activity.</p>

            <a href="Edit Profile.html" class="edit-btn">Edit Profile</a>

            <h4>My Posts</h4>

            <form action="">
                <select id="AllPosts">
                    <option>All Posts</option>
                    <option>Lost</option>
                    <option>Found</option>
                </select>
            </form>

        </div>

    </main>

</body>

</html>
