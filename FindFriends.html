<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Friends</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            background: rgb(60, 45, 131);
            display: flex;
            min-height: 100vh;
        }

        aside {
            width: 250px;
            background: rgb(14, 3, 77);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {
            text-decoration: none;
            color: white;
            background: rgb(20, 8, 91);
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            transition: .3s;
        }

        nav a:hover {
            background: white;
            color: black;
        }

        main {
            flex: 1;
            padding: 35px;
        }

        .top-search {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .top-search input {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        .top-search button {
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: rgb(20, 8, 91);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: .3s;
        }

        .top-search button:hover {
            background: rgb(12, 3, 62);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .2);
        }

        h2 {
            color: rgb(60, 45, 131);
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            color: rgb(60, 45, 131);
            margin-bottom: 6px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: rgb(60, 45, 131);
            box-shadow: 0 0 5px rgba(60, 45, 131, .25);
        }

        .results {
            grid-column: 1 / 3;
            margin-top: 20px;
            padding: 20px;
            background: rgb(245, 245, 245);
            border-radius: 10px;
            min-height: 220px;
        }

        .results h3 {
            color: rgb(60, 45, 131);
            margin-bottom: 15px;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }

        @media(max-width:900px) {

            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
            }

            main {
                padding: 20px;
            }

            .search-form {
                grid-template-columns: 1fr;
            }

            .results {
                grid-column: auto;
            }

            .top-search {
                flex-direction: column;
            }

            .top-search button {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <aside>

        <div class="logo">
            <img src="cmpLOGO.jpeg" alt="" width="180">
        </div>

        <nav>
            <a href="friends.html">Friends</a>
            <a href="FindFriends.html">Find Friends</a>
            <a href="Friend_req.html">Friend Requests</a>
        </nav>

    </aside>

    <main>

        <div class="top-search">
            <input type="text" placeholder="Search anything...">
            <button>Go</button>
        </div>

        <div class="card">

            <h2>Friends</h2>

            <p>Search for students and teachers at the university and connect with them.</p>

            <div class="search-form">

                <div class="field">
                    <label>Email Address</label>
                    <input type="email" placeholder="Search Email">
                </div>

                <div class="field">
                    <label>Department</label>
                    <select>
                        <option>CSE</option>
                        <option>BBA</option>
                        <option>ENG</option>
                        <option>LAW</option>
                        <option>SWE</option>
                        <option>DS</option>
                    </select>
                </div>

                <div class="field">
                    <label>ID</label>
                    <input type="text" placeholder="Search ID">
                </div>

                <div class="field">
                    <label>Name</label>
                    <input type="text" placeholder="Search Name">
                </div>

                <div class="results">
                    <h3>Search Results</h3>
                </div>

            </div>

        </div>

        <div class="back">
            <a href="Home_Feed.html">← Back to Home</a>
        </div>

    </main>

</body>

</html>
