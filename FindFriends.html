<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Friends</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

body {
    background: rgb(60, 45, 131);
    display: flex;
    min-height: 100vh;
}

/* Sidebar */

aside {
    width: 250px;
    background: rgb(14, 3, 77);
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

nav a {
    text-decoration: none;
    color: white;
    background: rgb(20, 8, 91);
    padding: 12px;
    border-radius: 8px;
    font-size: 18px;
    transition: .3s;
}

nav a:hover {
    background: white;
    color: black;
    transform: translateX(5px);
}

/* Main */

main {
    flex: 1;
    padding: 35px;
}

/* Top Search */

.top-search {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.top-search input {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

.top-search button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: rgb(20, 8, 91);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.top-search button:hover {
    background: rgb(12, 3, 62);
}

/* Card */

.card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 6px 15px rgba(0,0,0,.2);
}

.card h2 {
    color: rgb(60, 45, 131);
    margin-bottom: 10px;
}

.card p {
    color: #555;
    margin-bottom: 25px;
}

/* Search Form */

.search-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    color: rgb(60, 45, 131);
    margin-bottom: 6px;
}

input,
select {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    transition: .3s;
}

input:focus,
select:focus {
    border-color: rgb(60,45,131);
    box-shadow: 0 0 5px rgba(60,45,131,.3);
}

/* Results */

.results {
    grid-column: 1 / 3;
    margin-top: 20px;
    padding: 20px;
    background: rgb(245,245,245);
    border-radius: 10px;
    min-height: 250px;
}

.results h3 {
    color: rgb(60,45,131);
    margin-bottom: 15px;
}

/* User Card */

.user-card {
    background: white;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.user-card h4 {
    color: rgb(60,45,131);
    margin-bottom: 10px;
}

.user-card p {
    margin: 5px 0;
    color: #555;
}

.user-card button {
    margin-top: 12px;
    background: rgb(60,45,131);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: .3s;
}

.user-card button:hover {
    background: rgb(20,8,91);
}

.user-card button:disabled {
    background: gray;
    cursor: not-allowed;
}

/* Back */

.back {
    margin-top: 25px;
}

.back a {
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.back a:hover {
    text-decoration: underline;
}

/* Responsive */

@media (max-width:900px) {

    body {
        flex-direction: column;
    }

    aside {
        width: 100%;
    }

    main {
        padding: 20px;
    }

    .search-form {
        grid-template-columns: 1fr;
    }

    .results {
        grid-column: auto;
    }

    .top-search {
        flex-direction: column;
    }

    .top-search button {
        width: 100%;
    }
}
    </style>

    <link rel="stylesheet" href="FindFriends.css">
</head>

<body>

    <aside>

        <div class="logo">
            <img src="cmpLOGO.jpeg" alt="Logo" width="180">
        </div>

        <nav>
            <a href="friends.html">Friends</a>
            <a href="FindFriends.html">Find Friends</a>
            <a href="Friend_req.html">Friend Requests</a>
        </nav>

    </aside>

    <main>

        <div class="top-search">
            <input type="text" id="topSearch" placeholder="Search anything...">
            <button id="topSearchBtn">Go</button>
        </div>

        <div class="card">

            <h2>Find Friends</h2>

            <p>Search for students and teachers at the university and connect with them.</p>

            <div class="search-form">

                <div class="field">
                    <label>Email Address</label>
                    <input type="email" id="emailInput" placeholder="Search Email">
                </div>

                <div class="field">
                    <label>Department</label>
                    <select id="departmentInput">
                        <option value="">All Departments</option>
                        <option value="CSE">CSE</option>
                        <option value="BBA">BBA</option>
                        <option value="ENG">ENG</option>
                        <option value="LAW">LAW</option>
                        <option value="SWE">SWE</option>
                        <option value="DS">DS</option>
                    </select>
                </div>

                <div class="field">
                    <label>ID</label>
                    <input type="text" id="idInput" placeholder="Search ID">
                </div>

                <div class="field">
                    <label>Name</label>
                    <input type="text" id="nameInput" placeholder="Search Name">
                </div>

                <div class="results" id="results">

                    <h3>Search Results</h3>

                    <p>Use the search fields above to find students.</p>

                </div>

            </div>

        </div>

        <div class="back">
            <a href="Home_Feed.html">← Back to Home</a>
        </div>

    </main>

    <script src="FindFriends.js"></script>

</body>

</html>
